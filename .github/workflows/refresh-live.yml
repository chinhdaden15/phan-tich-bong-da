name: Cập nhật nhanh sau trận

# Lịch chạy tính theo ngân sách 2.000 phút/tháng của gói miễn phí.
#
# Mỗi lần chạy tốn khoảng 2 phút, phần lớn là checkout và cài thư viện — công
# việc thực tế chỉ vài giây nhờ các cửa thoát sớm trong refresh_live.py.
#
#   12 lần/ngày trong khung 12:00-23:00 UTC (19:00-06:00 giờ VN, lúc bóng lăn
#      và vừa kết thúc ở châu Âu) -> bảng xếp hạng mới trong vòng một tiếng
#    3 lần/ngày ngoài khung đó, vì gần như không có trận nào kết thúc
#
#   15 lần × 2 phút × 30 ngày = 900 phút
#   cộng update-data.yml (3 lần/ngày × 7 phút × 30 = 630) = 1.530 phút/tháng
on:
  schedule:
    - cron: "20 12-23 * * *"
    - cron: "20 0,4,8 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-live
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện
        run: pip install -r pipeline/requirements.txt

      - name: Cập nhật BXH, lịch sử và đội hình
        env:
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
        run: python pipeline/refresh_live.py

      - name: Commit nếu có đội hình mới
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "Chưa có đội hình mới."
          else
            git commit -m "chore: đội hình ra sân $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --strategy-option=theirs
            git push
          fi
