name: Cập nhật nhanh sau trận

# Chạy mỗi 3 TIẾNG, để ĐẢM BẢO dữ liệu không bao giờ cũ quá 6 tiếng.
#
# Vì sao 3 chứ không phải 6: cron của GitHub Actions gói miễn phí là "cố gắng"
# chứ không cam kết. Đo trên chính repo này, các lần chạy theo lịch bị trễ
# 6, 8, 9, 24, 30 và 37 phút. Đặt đúng 6 tiếng thì chỉ cần một lần trễ hoặc bị
# bỏ qua là vượt mốc. Đặt 3 tiếng thì kể cả bỏ lỡ trọn một nhịp vẫn còn trong
# hạn 6 tiếng.
#
# Giờ UTC 00,03,06,09,12,15,18,21  ->  giờ VN 07,10,13,16,19,22,01,04
#
# Ngân sách: 8 lần × 2 phút × 30 ngày = 480 phút/tháng
on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-live
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện
        run: pip install -r pipeline/requirements.txt

      - name: Cập nhật BXH, lịch sử và đội hình
        env:
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          # Thiếu khoá này thì phần kết quả Nations League im lặng trả rỗng:
          # bảng xếp hạng và lịch sử của giải đó không bao giờ được cập nhật
          # giữa hai lần dựng đầy đủ, vì ESPN bị chặn trên máy chủ nên nguồn
          # kết quả duy nhất là endpoint scores của The Odds API.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python pipeline/refresh_live.py

      - name: Commit nếu có đội hình mới
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "Chưa có đội hình mới."
          else
            git commit -m "chore: đội hình ra sân $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --strategy-option=theirs
            git push
          fi
