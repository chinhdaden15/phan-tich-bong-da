name: Cập nhật dữ liệu bóng đá

# Chạy 3 lần/ngày. Đây là công việc nặng — khớp lại toàn bộ mô hình, khoảng 7
# phút mỗi lần — nên chỉ chạy khi thật cần.
#
# Những thứ đổi sau mỗi trận (bảng xếp hạng, kết quả, lịch sử, đội hình) đã
# chuyển sang refresh-live.yml chạy dày hơn nhiều mà rất nhẹ. Ở đây chỉ còn
# việc khớp lại mô hình và sinh dự đoán, vốn không cần cập nhật theo giờ vì
# sức mạnh đội bóng thay đổi rất chậm.
#
# Phần kèo tự hãm bằng cache 11 tiếng trong odds_live.py nên vẫn chỉ tốn
# khoảng 2 lượt gọi mỗi ngày cho mỗi giải.
on:
  schedule:
    - cron: "0 2,10,18 * * *"
  workflow_dispatch:        # cho phép bấm chạy tay
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/update-data.yml"

# Tránh hai lần chạy cùng lúc ghi đè lên nhau.
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện
        run: pip install -r pipeline/requirements.txt

      # Cache dữ liệu lịch sử để không tải lại cùng một file mỗi lần chạy.
      - name: Khôi phục cache dữ liệu
        uses: actions/cache@v4
        with:
          path: data/cache
          key: football-cache-${{ github.run_id }}
          restore-keys: football-cache-

      - name: Dựng dữ liệu
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
        run: python pipeline/build.py

      - name: Commit nếu có thay đổi
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "Dữ liệu không đổi, bỏ qua commit."
          else
            git commit -m "chore: cập nhật dữ liệu $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
