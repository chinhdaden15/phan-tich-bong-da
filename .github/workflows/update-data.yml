name: Cập nhật dữ liệu bóng đá

# Chạy mỗi 8 tiếng (01:35, 09:35, 17:35 UTC = 08:35, 16:35, 00:35 giờ VN).
# Lệch 30 phút so với refresh-live.yml để hai việc không tranh nhau chạy.
#
# Đây là công việc nặng — khớp lại toàn bộ mô hình, khoảng 7
# phút mỗi lần — nên chỉ chạy khi thật cần.
#
# Những thứ đổi sau mỗi trận (bảng xếp hạng, kết quả, lịch sử, đội hình) đã
# chuyển sang refresh-live.yml chạy dày hơn nhiều mà rất nhẹ. Ở đây chỉ còn
# việc khớp lại mô hình và sinh dự đoán, vốn không cần cập nhật theo giờ vì
# sức mạnh đội bóng thay đổi rất chậm.
#
# Phần kèo tự hãm bằng cache 11 tiếng trong odds_live.py nên vẫn chỉ tốn
# khoảng 2 lượt gọi mỗi ngày cho mỗi giải.
on:
  schedule:
    - cron: "35 1,9,17 * * *"
  workflow_dispatch:        # cho phép bấm chạy tay
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/update-data.yml"

# Tránh hai lần chạy cùng lúc ghi đè lên nhau.
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện
        run: pip install -r pipeline/requirements.txt

      # Cache dữ liệu lịch sử để không tải lại cùng một file mỗi lần chạy.
      - name: Khôi phục cache dữ liệu
        uses: actions/cache@v4
        with:
          path: data/cache
          key: football-cache-${{ github.run_id }}
          restore-keys: football-cache-

      - name: Dựng dữ liệu
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
        run: python pipeline/build.py

      - name: Commit nếu có thay đổi
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "Dữ liệu không đổi, bỏ qua commit."
          else
            git commit -m "chore: cập nhật dữ liệu $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Hai workflow có thể chạy chồng giờ và cùng đẩy lên. Thiếu bước
            # rebase này thì lần chạy nào tới sau bị từ chối và cả job báo
            # hỏng, dù dữ liệu hoàn toàn bình thường — đã xảy ra lúc 07:05.
            #
            # --strategy-option=theirs: khi rebase, "theirs" là commit đang
            # được phát lại, tức dữ liệu vừa dựng của chính lần chạy này. Đúng
            # thứ cần giữ, và cần thiết vì .gitattributes đặt các tệp dữ liệu
            # là merge=binary nên không thể tự trộn.
            for i in 1 2 3; do
              git pull --rebase --strategy-option=theirs && git push && break
              echo "Đẩy lên thất bại, thử lại lần $i..."
              sleep 5
            done
          fi
