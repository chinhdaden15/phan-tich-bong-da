<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<meta name="description" content="Lịch thi đấu, sức mạnh đội bóng và phân tích trước trận dựa trên mô hình Dixon-Coles">
<title>Phân Tích Bóng Đá</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1 class="brand">Phân Tích Bóng Đá</h1>
    <button id="refreshBtn" class="icon-btn" aria-label="Tải lại dữ liệu">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
    </button>
  </div>
  <nav class="league-tabs" id="leagueTabs" aria-label="Chọn giải đấu"></nav>
</header>

<main id="view" class="view">
  <div class="loading" id="loading">
    <div class="spinner" aria-hidden="true"></div>
    <p>Đang tải dữ liệu…</p>
  </div>
</main>

<nav class="tabbar" aria-label="Điều hướng chính">
  <button class="tab active" data-tab="fixtures">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    <span>Lịch đấu</span>
  </button>
  <button class="tab" data-tab="standings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16M7 20V10M12 20V4M17 20v-7"/></svg>
    <span>BXH</span>
  </button>
  <button class="tab" data-tab="strength">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M21 7v5h-5"/></svg>
    <span>Sức mạnh</span>
  </button>
  <button class="tab" data-tab="about">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Cài đặt</span>
  </button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Chi tiết trận đấu">
    <div class="sheet-grip" data-close></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
